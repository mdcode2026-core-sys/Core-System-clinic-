name: Stage 11 Documentation Finalize

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Synchronize final SHA and blocker state
        env:
          FINAL_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          final_sha = os.environ['FINAL_SHA']
          for name in ['docs/STAGE-11-CLOSURE-PRODUCTION-READINESS-2026-08-29.md','DOCUMENTATION_STATUS.md','PROJECT_HANDOFF.md']:
              p = Path(name)
              text = p.read_text().replace('8ce80503c8e253849bee3d408daa7cba986f38c8', final_sha)
              p.write_text(text)
          PY
          rm .github/workflows/stage11-doc-finalize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/STAGE-11-CLOSURE-PRODUCTION-READINESS-2026-08-29.md DOCUMENTATION_STATUS.md PROJECT_HANDOFF.md .github/workflows/stage11-doc-finalize.yml
          git commit -m "docs(stage11): finalize production blocker records"
          git push origin HEAD:main
