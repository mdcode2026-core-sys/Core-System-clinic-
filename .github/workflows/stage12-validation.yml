name: Stage 12 Validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage12:
    name: Stage 12 Security + Permission Regression Gate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify lockfile and install dependencies
        run: npm ci --ignore-scripts
      - name: Production dependency security audit
        run: npm audit --omit=dev --audit-level=high
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Security changed-surface ESLint
        run: npx eslint src/core/permissions/permissionEngine.ts src/core/entitlements/entitlementEngine.ts src/core/workspace/workspaceEngine.ts src/core/workspace/hooks/useWorkspace.ts src/core/search/actions.ts src/domain/inventory/inventory.actions.ts tools/security-permission-stage12-audit.mjs
      - name: Stage 12 security permission audit
        run: npm run ux:security-stage12
      - name: I18N audit
        run: npm run i18n:audit
      - name: I18N parity
        run: npm run i18n:parity
      - name: Stage 5 Widget Catalog audit
        run: npm run ux:widget-catalog
      - name: Stage 6 Patient Flow audit
        run: npm run ux:patient-flow-stage6
      - name: Stage 7 Patient Context audit
        run: npm run ux:patient-context-stage7
      - name: Stage 8 Global Search audit
        run: npm run ux:global-search-stage8
      - name: Stage 9 Overview / Dashboard audit
        run: node tools/overview-dashboard-stage9-audit.mjs
      - name: Stage 10 Sidebar audit
        run: node tools/sidebar-stage10-audit.mjs
      - name: Stage 11 Mobile + Responsive audit
        run: npm run ux:mobile-stage11
      - name: Production build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://qaslsjyxjwvdoiczmhgq.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_APP_URL: http://localhost:3000
        run: npm run build
