name: Stage 13 Runtime E2E Validation
on:
  push:
    branches: [stage13-runtime-e2e-validation]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  stage13:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run i18n:audit
      - run: npm run i18n:parity
      - run: npm run ux:security-stage12
      - run: |
          npm run ux:widget-catalog
          npm run ux:domain-surface
          npm run ux:patient-flow-stage6
          npm run ux:patient-context-stage7
          npm run ux:global-search-stage8
          npm run ux:mobile-stage11
      - name: Production build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://qaslsjyxjwvdoiczmhgq.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_APP_URL: https://core-system-clinic.vercel.app
        run: npm run build
      - name: Production runtime smoke
        env:
          CORE_SYSTEM_PRODUCTION_URL: https://core-system-clinic.vercel.app
        run: npm run ux:runtime-stage13
