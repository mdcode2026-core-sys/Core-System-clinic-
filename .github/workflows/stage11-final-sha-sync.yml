name: Stage 11 Final SHA Documentation Sync

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync final repository SHA in Stage 11 records
        env:
          FINAL_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          final_sha = os.environ['FINAL_SHA']
          for name in ['docs/STAGE-11-CLOSURE-PRODUCTION-READINESS-2026-08-29.md','DOCUMENTATION_STATUS.md','PROJECT_HANDOFF.md']:
              p = Path(name)
              text = p.read_text()
              text = text.replace('72342418084722a503b55304ac273e1f19fa9c99', final_sha)
              p.write_text(text)
          PY
          rm .github/workflows/stage11-final-sha-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/STAGE-11-CLOSURE-PRODUCTION-READINESS-2026-08-29.md DOCUMENTATION_STATUS.md PROJECT_HANDOFF.md .github/workflows/stage11-final-sha-sync.yml
          git commit -m "docs(stage11): sync final repository SHA"
          git push origin HEAD:main
