name: Stage 11 Final Status Sync

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record external Vercel production blocker
        env:
          FINAL_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          final_sha = os.environ['FINAL_SHA']
          files = ['docs/STAGE-11-CLOSURE-PRODUCTION-READINESS-2026-08-29.md','DOCUMENTATION_STATUS.md','PROJECT_HANDOFF.md']
          for name in files:
              p = Path(name)
              text = p.read_text()
              text = text.replace('ceeec808d3e4ec27eead46d3da222b826b7e4cd6', final_sha)
              text = text.replace('72342418084722a503b55304ac273e1f19fa9c99', final_sha)
              text = text.replace('Stage 11 — Mobile & Language Validation: **CLOSED / PRODUCTION READY**.', 'Stage 11 — Mobile & Language Validation: **IMPLEMENTATION CLOSED / PRODUCTION DEPLOYMENT BLOCKED**.')
              text = text.replace('Stage 11 — Mobile & Language Validation\n\n**Status: CLOSED / PRODUCTION READY.**', 'Stage 11 — Mobile & Language Validation\n\n**Status: IMPLEMENTATION COMPLETE / PRODUCTION DEPLOYMENT BLOCKED BY VERCEL BUILD-RATE-LIMIT.**')
              text = text.replace('**Status:** CLOSED / PRODUCTION READY', '**Status:** IMPLEMENTATION COMPLETE / PRODUCTION DEPLOYMENT BLOCKED')
              text = text.replace('Stage 11 is **CLOSED / PRODUCTION READY**.', 'Stage 11 implementation is complete. Final production readiness is blocked by the Vercel Git deployment build-rate-limit; no manual Vercel build/API workaround was used.')
              p.write_text(text)
          closure = Path('docs/STAGE-11-CLOSURE-PRODUCTION-READINESS-2026-08-29.md')
          text = closure.read_text()
          if '## External/System Blocker — Vercel build-rate-limit' not in text:
              text += '''\n\n## External/System Blocker — Vercel build-rate-limit\n\n- GitHub → Vercel Git Integration is configured for `main` (`vercel.json` has `git.deploymentEnabled.main = true`).\n- Final GitHub Stage 11 validation run #15 passed all blocking gates on the final code candidate.\n- GitHub combined status for the final candidate reports Vercel `failure` with target `upgradeToPro=build-rate-limit`.\n- Vercel project linkage and Production Branch configuration were verified; no manual Vercel build/API request was used.\n- Current production deployment remains the prior production SHA `3ed073bfca06dce4ef3d2de2afddd78c00ad89cc`; runtime logs for the current production deployment show no error/fatal entries.\n- This blocker prevents claiming `Production Ready = YES` until Vercel accepts the Git-integrated production deployment for the final `main` SHA.\n'''
          closure.write_text(text)
          PY
          rm .github/workflows/stage11-final-status-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/STAGE-11-CLOSURE-PRODUCTION-READINESS-2026-08-29.md DOCUMENTATION_STATUS.md PROJECT_HANDOFF.md .github/workflows/stage11-final-status-sync.yml
          git commit -m "docs(stage11): record Vercel production blocker"
          git push origin HEAD:main
