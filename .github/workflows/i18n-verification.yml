name: I18N Verification

on:
  push:
    branches: [main, i18n-completion-2026-08-24]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run i18n:parity
      - run: npm run build
      - run: npm run i18n:audit
