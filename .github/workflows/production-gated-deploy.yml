name: Production Candidate Release Gate

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact candidate SHA whose unified test engine run must already be successful
        required: true
        type: string
  workflow_run:
    workflows: ["CORE SYSTEM Unified Test Execution Engine"]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  candidate:
    name: Release Candidate Eligibility
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Resolve exact validated candidate
        id: candidate
        env:
          MANUAL_SHA: ${{ inputs.candidate_sha }}
          WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          SHA="$MANUAL_SHA"
          if [ -z "$SHA" ]; then SHA="$WORKFLOW_SHA"; fi
          test -n "$SHA"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "candidate_sha=$SHA"

      - name: Record release-candidate eligibility
        env:
          EXPECTED_SHA: ${{ steps.candidate.outputs.sha }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id || '' }}
        run: |
          set -euo pipefail
          cat > release-candidate-evidence.json <<EOF
          {
            "status": "ELIGIBLE_AFTER_UNIFIED_TEST_ENGINE_SUCCESS",
            "candidateSha": "${EXPECTED_SHA}",
            "workflowRunId": "${{ github.run_id }}",
            "sourceUnifiedTestRunId": "${SOURCE_RUN_ID}",
            "vercelUsedForValidation": false,
            "validationAuthority": "CORE SYSTEM Unified Test Execution Engine"
          }
          EOF
          cat release-candidate-evidence.json

      - name: Upload release-candidate evidence
        uses: actions/upload-artifact@v4
        with:
          name: core-system-release-candidate-evidence-${{ steps.candidate.outputs.sha }}
          path: release-candidate-evidence.json
          if-no-files-found: error
