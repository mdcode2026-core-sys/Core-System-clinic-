name: Production Candidate Release Gate

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact validated candidate SHA to prepare for final release
        required: true
        type: string
  workflow_run:
    workflows: ["CORE SYSTEM Reality Audit - Local CI"]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  candidate:
    name: Validate release candidate without Vercel
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Resolve exact validated candidate
        id: candidate
        env:
          MANUAL_SHA: ${{ inputs.candidate_sha }}
          WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          SHA="$MANUAL_SHA"
          if [ -z "$SHA" ]; then SHA="$WORKFLOW_SHA"; fi
          test -n "$SHA"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "candidate_sha=$SHA"

      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.candidate.outputs.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci

      - name: Execute release candidate engineering gate
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://qaslsjyxjwvdoiczmhgq.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          CORE_SYSTEM_E2E_EMAIL: ${{ secrets.CORE_SYSTEM_E2E_EMAIL }}
          CORE_SYSTEM_E2E_PASSWORD: ${{ secrets.CORE_SYSTEM_E2E_PASSWORD }}
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
        run: |
          npm run test:execution-setup
          npx tsc --noEmit
          npm run lint
          npm run i18n:audit
          npm run i18n:parity
          npm run ajm:audit
          npm run ajm:migrations
          npm run ux:widget-catalog
          npm run ux:domain-surface
          npm run ux:patient-flow-stage6
          npm run ux:patient-context-stage7
          npm run ux:global-search-stage8
          npm run ux:mobile-stage11
          npm run ux:security-stage12
          npm run ux:legacy-stage14
          npm run ux:docs-stage15
          npm run test:cross-domain-runtime
          npm run build

      - name: Record release-candidate evidence
        env:
          EXPECTED_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          set -euo pipefail
          cat > release-candidate-evidence.json <<EOF
          {
            "status": "VALIDATED_FOR_FINAL_RELEASE",
            "candidateSha": "${EXPECTED_SHA}",
            "workflowRunId": "${{ github.run_id }}",
            "sourceRealityWorkflowRunId": "${{ github.event.workflow_run.id || '' }}",
            "vercelUsedForValidation": false,
            "runtimeValidationEnvironment": "GitHub Actions local production server"
          }
          EOF

      - name: Upload release-candidate evidence
        uses: actions/upload-artifact@v4
        with:
          name: core-system-release-candidate-evidence-${{ steps.candidate.outputs.sha }}
          path: release-candidate-evidence.json
          if-no-files-found: error
