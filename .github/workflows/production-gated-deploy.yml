name: Production Candidate Handoff

on:
  workflow_run:
    workflows: ["UX Stages 0-8 CI"]
    types: [completed]
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  candidate:
    name: Validate production candidate
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Resolve validated candidate
        id: candidate
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Checkout validated candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.candidate.outputs.sha }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies from lockfile
        run: npm ci
      - name: Verify production build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://qaslsjyxjwvdoiczmhgq.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_APP_URL: https://core-system-clinic.vercel.app
        run: npm run build
      - name: Install browser runtime
        run: npx playwright install --with-deps chromium
      - name: Authenticated Production E2E
        env:
          CORE_SYSTEM_PRODUCTION_URL: https://core-system-clinic.vercel.app
          CORE_SYSTEM_E2E_EMAIL: ${{ secrets.CORE_SYSTEM_E2E_EMAIL }}
          CORE_SYSTEM_E2E_PASSWORD: ${{ secrets.CORE_SYSTEM_E2E_PASSWORD }}
        run: node tools/ajm-production-auth-e2e.mjs
      - name: Production deployment handoff
        run: |
          echo "Validated production candidate: ${{ steps.candidate.outputs.sha }}"
          echo "Production build and authenticated Production E2E passed."
          echo "Production deployment is delegated to the existing Vercel Git integration on main."
      - name: Record candidate
        run: |
          echo "Production candidate: ${{ steps.candidate.outputs.sha }}"
          echo "Authenticated Production E2E gate passed."
          echo "Vercel production deployment authority: Git integration on main."