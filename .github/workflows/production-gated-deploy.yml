name: Production Candidate Handoff

on:
  workflow_run:
    workflows: ["UX Stages 0-8 CI"]
    types: [completed]
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  candidate:
    name: Validate production candidate
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Resolve validated candidate
        id: candidate
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Checkout validated candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.candidate.outputs.sha }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies from lockfile
        run: npm ci
      - name: Verify production build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://qaslsjyxjwvdoiczmhgq.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_APP_URL: https://core-system-clinic.vercel.app
        run: npm run build
      - name: Run lint/static and AJM/UX integrity audits
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://qaslsjyxjwvdoiczmhgq.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          npm run lint
          npm run ajm:audit
          npm run ajm:migrations
          npm run i18n:audit
          npm run ux:widget-catalog
          npm run ux:domain-surface
          npm run ux:patient-flow-stage6
          npm run ux:patient-context-stage7
          npm run ux:global-search-stage8
          npm run ux:mobile-stage11
          npm run ux:security-stage12
          npm run ux:legacy-stage14
          npm run ux:docs-stage15
      - name: Install Playwright browser
        run: npx -y @playwright/test@1.55.0 install --with-deps chromium
      - name: Install Playwright test package without lockfile mutation
        run: npm install --no-save --no-package-lock @playwright/test@1.55.0
      - name: Authenticated Production E2E
        env:
          CORE_SYSTEM_PRODUCTION_URL: https://core-system-clinic.vercel.app
          CORE_SYSTEM_E2E_EMAIL: ${{ secrets.CORE_SYSTEM_E2E_EMAIL }}
          CORE_SYSTEM_E2E_PASSWORD: ${{ secrets.CORE_SYSTEM_E2E_PASSWORD }}
        run: npx playwright test tools/ajm-production-auth-e2e.spec.mjs --reporter=line
      - name: Production deployment handoff
        run: |
          echo "Validated production candidate: ${{ steps.candidate.outputs.sha }}"
          echo "Build, static/AJM/UX audits, and authenticated Production E2E passed."
          echo "Production deployment is delegated to the existing Vercel Git integration on main."
      - name: Record candidate
        run: |
          echo "Production candidate: ${{ steps.candidate.outputs.sha }}"
          echo "All configured acceptance gates passed."
