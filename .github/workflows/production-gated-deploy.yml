name: Production Candidate Handoff

on:
  workflow_run:
    workflows: ["UX Stages 0-6 CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  candidate:
    name: Confirm validated production candidate
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies from lockfile
        run: npm ci
      - name: Verify production build
        run: npm run build
      - name: Record candidate commit
        run: |
          echo "Production candidate: ${{ github.event.workflow_run.head_sha }}"
          echo "Vercel deployment is delegated to the repository's Git integration."
