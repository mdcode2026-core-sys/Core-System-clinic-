name: Production Gated Release — CSAPI

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact main SHA to validate and release
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-gated-release
  cancel-in-progress: false

env:
  NEXT_PUBLIC_SUPABASE_URL: https://qaslsjyxjwvdoiczmhgq.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
  CORE_SYSTEM_E2E_EMAIL: ${{ secrets.CORE_SYSTEM_E2E_EMAIL }}
  CORE_SYSTEM_E2E_PASSWORD: ${{ secrets.CORE_SYSTEM_E2E_PASSWORD }}
  NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
  VERCEL_ORG_ID: team_VlSz1DTffYBwmUEcYQtR8JiN
  VERCEL_PROJECT_ID: prj_DN3UgHVBUHrFG6i6ycxAWj0bXLbG

jobs:
  predeploy:
    name: VERIFY — Pre-production release gates
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      candidate_sha: ${{ steps.candidate.outputs.sha }}
    steps:
      - name: Resolve exact candidate
        id: candidate
        shell: bash
        env:
          INPUT_SHA: ${{ inputs.candidate_sha }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          SHA="${INPUT_SHA:-${PUSH_SHA}}"
          if ! [[ "$SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Invalid candidate SHA: $SHA" >&2
            exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.candidate.outputs.sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Engineering tests
        run: |
          npx tsc --noEmit
          npm run lint
          npm run build

      - name: Clean DB migration verification
        shell: bash
        run: |
          set -euo pipefail
          # A fresh GitHub-hosted runner has no local Supabase state.
          # Initialize only the disposable CI config, then let db start create the
          # fresh local database and apply the repository migration chain once.
          # Do NOT follow db start with db reset: current Supabase CLI versions have a
          # documented intermittent schema-initialization race during reset, where the
          # service migration jobs can race the long-running storage/realtime services.
          # Re-running reset would therefore add a second migration lifecycle instead
          # of verifying the clean first-build path.
          npx --yes supabase@latest init
          sed -i 's/^project_id = .*/project_id = "core-system-gate03-ci"/' supabase/config.toml
          trap 'npx --yes supabase@latest stop --no-backup || true' EXIT
          npx --yes supabase@latest db start
          npx --yes supabase@latest migration list --local
          npx --yes supabase@latest db lint --local
          echo "CLEAN_DB_MIGRATION_VERIFICATION=PASS"

      - name: Gate 03 structural verification
        run: npm run csapi:gate03-identity

      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.55.0 playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start exact candidate local production runtime
        shell: bash
        env:
          CORE_SYSTEM_PRODUCTION_URL: http://127.0.0.1:3000
        run: |
          set -euo pipefail
          npm start > local-production.log 2>&1 &
          echo $! > local-production.pid
          for attempt in $(seq 1 60); do
            if curl -fsS --max-time 5 http://127.0.0.1:3000/api/build-info >/tmp/build-info.json; then
              cat /tmp/build-info.json
              break
            fi
            sleep 2
          done
          test -s /tmp/build-info.json
          grep -q '"verification":"production-candidate"' /tmp/build-info.json

      - name: Local authenticated route E2E
        env:
          CORE_SYSTEM_PRODUCTION_URL: http://127.0.0.1:3000
        run: |
          set -o pipefail
          npx playwright test tools/ajm-production-auth-e2e.spec.mjs --reporter=line 2>&1 | tee local-authenticated-route-e2e.log

      - name: Gate 03 focused authenticated identity E2E
        env:
          CORE_SYSTEM_PRODUCTION_URL: http://127.0.0.1:3000
        run: |
          set -o pipefail
          npm run csapi:gate03-identity-e2e 2>&1 | tee gate03-identity-e2e.log

      - name: Publish pre-production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-system-preproduction-evidence-${{ steps.candidate.outputs.sha }}
          path: |
            local-production.log
            local-authenticated-route-e2e.log
            gate03-identity-e2e.log
          if-no-files-found: warn

  deploy:
    name: DEPLOY — Await exact validated candidate via Vercel Git Integration
    needs: predeploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Wait for Vercel Git deployment to expose exact candidate
        shell: bash
        env:
          EXPECTED_SHA: ${{ needs.predeploy.outputs.candidate_sha }}
          PRODUCTION_URL: https://core-system-clinic.vercel.app
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            BODY="$(curl -fsS --max-time 10 "$PRODUCTION_URL/api/build-info" || true)"
            echo "VERCEL_GIT_DEPLOY_ATTEMPT=$attempt BODY=$BODY"
            if printf '%s' "$BODY" | grep -Fqi "$EXPECTED_SHA"; then
              echo "VERCEL_GIT_DEPLOYMENT=PASS"
              exit 0
            fi
            sleep 10
          done
          echo "VERCEL_GIT_DEPLOYMENT=FAIL expected=$EXPECTED_SHA" >&2
          exit 1

  production-verify:
    name: VERIFY — Production exact candidate + authenticated E2E
    needs: [predeploy, deploy]
    uses: ./.github/workflows/production-runtime-verification.yml
    with:
      candidate_sha: ${{ needs.predeploy.outputs.candidate_sha }}
    secrets: inherit
