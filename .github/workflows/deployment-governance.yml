name: CORE SYSTEM Deployment Governance Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact candidate SHA to validate before promotion
        required: true
        type: string

permissions:
  contents: read

jobs:
  pre-release-gate:
    name: Pre-release candidate validation
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Resolve candidate SHA
        id: candidate
        env:
          EVENT_SHA: ${{ github.event.pull_request.head.sha }}
          MANUAL_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          SHA="$MANUAL_SHA"
          if [ -z "$SHA" ]; then SHA="$EVENT_SHA"; fi
          test -n "$SHA"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Candidate SHA: $SHA"

      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.candidate.outputs.sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact lockfile dependencies
        run: npm ci

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: I18N integrity
        run: |
          npm run i18n:audit
          npm run i18n:parity

      - name: UX and architecture integrity
        run: |
          npm run ux:widget-catalog
          npm run ux:domain-surface
          npm run ux:patient-flow-stage6
          npm run ux:patient-context-stage7
          npm run ux:global-search-stage8
          npm run ux:mobile-stage11
          npm run ux:security-stage12
          npm run ux:legacy-stage14
          npm run ux:docs-stage15
          npm run ajm:audit
          npm run ajm:migrations

      - name: Production build without Vercel
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://qaslsjyxjwvdoiczmhgq.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
        run: npm run build

      - name: Gate result
        run: |
          echo "VALIDATED CANDIDATE: ${{ steps.candidate.outputs.sha }}"
          echo "No Vercel deployment is performed by this workflow."
          echo "Promotion is permitted only after this gate succeeds."
