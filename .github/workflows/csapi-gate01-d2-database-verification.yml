name: CSAPI Gate 01 — D2 Database Verification

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/**'
      - '.github/workflows/csapi-gate01-d2-database-verification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  database-verification:
    name: D2 — Local Supabase Postgres + pgTAP verification
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Initialize local Supabase configuration
        run: supabase init --force

      - name: Start only local database services required for migration verification
        run: >-
          supabase start
          -x gotrue,realtime,storage-api,imgproxy,kong,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: Reset local database from migration chain
        run: supabase db reset --no-seed

      - name: Run D2 pgTAP tests
        run: supabase test db supabase/tests/csapi_gate01_d2_database_foundations.sql

      - name: Verify migration history
        run: supabase migration list

      - name: Stop local Supabase database
        if: always()
        run: supabase stop || true

  application-regression:
    name: D2 — Application lint/build regression
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run production build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://qaslsjyxjwvdoiczmhgq.supabase.co
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
        run: npm run build
