name: Temporary Lint Diagnostic

on:
  push:
    branches: [audit/lint-report-20260906]

permissions:
  contents: write

jobs:
  report:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund --prefer-offline
      - name: Inspect offending helper components
        run: |
          node <<'NODE'
          const fs=require('fs');
          const files=['src/features/financial-resources/financial-resources-operations-center.tsx','src/features/financial-resources/financial-resources-workspace.tsx','src/features/financial-resources/financial-resources-settings.tsx','src/features/financial-resources/payment-center.tsx','src/features/financial-resources/financial-plans-operations.tsx','src/features/financial-resources/financial-plans-insurance-center.tsx'];
          let out='# Offending component declarations\\n\\n';
          for(const file of files){const s=fs.readFileSync(file,'utf8'); const names=[...s.matchAll(/const\\s+([A-Z][A-Za-z0-9_]*)\\s*=\\s*\\(/g)].map(m=>m[1]); out+=`## ${file}\\n\\n${[...new Set(names)].join(', ')||'(none)'}\\n\\n`;}
          fs.writeFileSync('HELPERS_TEMP.md',out);
          NODE
      - name: Publish report on audit branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add HELPERS_TEMP.md
          git commit -m 'chore(audit): inspect offending helper components' || true
          git push
