name: Temporary Lint Diagnostic

on:
  push:
    branches: [audit/lint-report-20260906]

permissions:
  contents: write

jobs:
  report:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund --prefer-offline
      - name: Generate concise lint diagnostics
        run: |
          npx eslint . --format json > /tmp/lint.json || true
          node <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('/tmp/lint.json','utf8'));
          const groups = new Map();
          for (const f of data) for (const m of f.messages) {
            const rule = m.ruleId || 'parse-error';
            if (!groups.has(rule)) groups.set(rule, []);
            groups.get(rule).push(`${f.filePath.replace(process.cwd()+'/','')}:${m.line}:${m.column} [${m.severity===2?'error':'warning'}] ${m.message.split('\\n')[0]}`);
          }
          const summary = [...groups.entries()].sort((a,b)=>b[1].length-a[1].length).map(([r,v])=>`${r}: ${v.length}`).join('\\n');
          fs.writeFileSync('LINT_SUMMARY_TEMP.md', `# ESLint Diagnostic\\n\\n${summary}\\n`);
          for (const [rule, lines] of groups) {
            const safe = rule.replace(/[^a-zA-Z0-9_-]/g,'_');
            fs.writeFileSync(`LINT_${safe}_TEMP.txt`, lines.join('\\n')+'\\n');
          }
          NODE
      - name: Publish report on audit branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add LINT_*_TEMP.*
          git commit -m 'chore(audit): publish concise lint diagnostics' || true
          git push
