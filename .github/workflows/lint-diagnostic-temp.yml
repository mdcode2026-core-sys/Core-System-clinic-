name: Temporary Lint Diagnostic

on:
  push:
    branches: [audit/lint-report-20260906]

permissions:
  contents: write

jobs:
  report:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund --prefer-offline
      - name: Close MedicalFilesPanel callback
        run: |
          node <<'NODE'
          const fs=require('fs');
          const file='src/features/medical-files/ui/MedicalFilesPanel.tsx';
          let s=fs.readFileSync(file,'utf8');
          const from='} });\n  }, [patientId, visitId, t.loadFailed]);';
          const to='} }), [patientId, visitId, t.loadFailed]);';
          if(s.includes(from)){s=s.replace(from,to);fs.writeFileSync(file,s)}
          NODE
      - name: Validate final repository state
        run: |
          npx tsc --noEmit
          npx eslint .
      - name: Remove temporary audit scaffolding
        if: success()
        run: |
          rm -f LINT_*_TEMP.* HELPERS_TEMP.md TEMP_*_AFTER_REFACTOR.txt TEMP_*_FINAL_DIAGNOSTIC.txt
          git rm -f .github/workflows/lint-diagnostic-temp.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(audit): remove temporary lint diagnostics'
          git push
