name: Temporary Lint Diagnostic

on:
  push:
    branches: [audit/lint-report-20260906]

permissions:
  contents: write

jobs:
  report:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund --prefer-offline
      - name: Close MedicalFilesPanel callback
        run: |
          node <<'NODE'
          const fs=require('fs');
          const file='src/features/medical-files/ui/MedicalFilesPanel.tsx';
          let s=fs.readFileSync(file,'utf8');
          const from='} });\n  }, [patientId, visitId, t.loadFailed]);';
          const to='} }), [patientId, visitId, t.loadFailed]);';
          if(!s.includes(from)) throw new Error('MedicalFilesPanel callback close pattern not found');
          s=s.replace(from,to);
          fs.writeFileSync(file,s);
          NODE
      - name: Validate full repository lint and TypeScript
        run: |
          npx tsc --noEmit > /tmp/tsc.log 2>&1 || true
          npx eslint . --format json > /tmp/lint.json || true
          node <<'NODE'
          const fs=require('fs');const data=JSON.parse(fs.readFileSync('/tmp/lint.json','utf8'));let e=0,w=0,rows=[];for(const f of data)for(const m of f.messages){m.severity===2?e++:w++;rows.push(`${f.filePath.replace(process.cwd()+'/','')}:${m.line}:${m.column} [${m.severity===2?'error':'warning'}] ${m.ruleId||'parse-error'} ${String(m.message).replace(/\s+/g,' ').slice(0,180)}`)}fs.writeFileSync('TEMP_LINT_FINAL_DIAGNOSTIC.txt',`Errors: ${e}\nWarnings: ${w}\nFindings: ${rows.length}\n\n${rows.join('\n')}\n`);fs.writeFileSync('TEMP_TSC_FINAL_DIAGNOSTIC.txt',fs.readFileSync('/tmp/tsc.log','utf8'));if(e||w)process.exitCode=1;
          NODE
      - name: Commit final repairs and diagnostics
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/features/medical-files/ui/MedicalFilesPanel.tsx TEMP_LINT_FINAL_DIAGNOSTIC.txt TEMP_TSC_FINAL_DIAGNOSTIC.txt
          git commit -m 'fix(medical-files): stabilize file loader callback' || true
          git push
