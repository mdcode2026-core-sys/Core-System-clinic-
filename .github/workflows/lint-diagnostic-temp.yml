name: Temporary Lint Diagnostic

on:
  push:
    branches: [audit/lint-report-20260906]

permissions:
  contents: write

jobs:
  report:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund --prefer-offline
      - name: Move render-created helper components to module scope
        run: |
          node <<'NODE'
          const fs=require('fs');
          const files=['src/features/financial-resources/financial-resources-operations-center.tsx','src/features/financial-resources/financial-resources-workspace.tsx','src/features/financial-resources/financial-resources-settings.tsx','src/features/financial-resources/payment-center.tsx','src/features/financial-resources/financial-plans-operations.tsx','src/features/financial-resources/financial-plans-insurance-center.tsx'];
          function extract(s,start){let i=start,par=0,br=0,sq=0,quote=null,template=false,esc=false;for(;i<s.length;i++){const c=s[i];if(quote){if(esc){esc=false;continue}if(c==='\\'){esc=true;continue}if(c===quote)quote=null;continue}if(template){if(esc){esc=false;continue}if(c==='\\'){esc=true;continue}if(c==='`')template=false;continue}if(c==='"'||c==="'"){quote=c;continue}if(c==='`'){template=true;continue}if(c==='(')par++;else if(c===')')par--;else if(c==='{')br++;else if(c==='}')br--;else if(c==='[')sq++;else if(c===']')sq--;if(c===';'&&par===0&&br===0&&sq===0)return i+1}return -1}
          for(const file of files){let s=fs.readFileSync(file,'utf8'),moved=[];const re=/\n[ \t]+const\s+([A-Z][A-Za-z0-9_]*)\s*=\s*\(/g;let m;while((m=re.exec(s))){const start=m.index+1,end=extract(s,start);if(end<0)continue;moved.push(s.slice(start,end))}if(!moved.length)continue;for(const decl of moved)s=s.replace('\n'+decl,'');const anchor=s.search(/export\s+(?:default\s+)?(?:async\s+)?function\s/);if(anchor<0)throw new Error(`No module export anchor in ${file}`);s=s.slice(0,anchor)+moved.join('\n')+'\n'+s.slice(anchor);fs.writeFileSync(file,s)}
          NODE
      - name: Validate and publish diagnostics
        run: |
          npx tsc --noEmit > /tmp/tsc.log 2>&1 || true
          npx eslint src/features/financial-resources/financial-resources-operations-center.tsx src/features/financial-resources/financial-resources-workspace.tsx src/features/financial-resources/financial-resources-settings.tsx src/features/financial-resources/payment-center.tsx src/features/financial-resources/financial-plans-operations.tsx src/features/financial-resources/financial-plans-insurance-center.tsx --format compact > /tmp/lint.log 2>&1 || true
          cp /tmp/tsc.log TEMP_TSC_AFTER_REFACTOR.txt
          cp /tmp/lint.log TEMP_LINT_AFTER_REFACTOR.txt
          echo '--- TSC ---'; cat /tmp/tsc.log
          echo '--- LINT ---'; cat /tmp/lint.log
      - name: Commit staged refactor and diagnostics
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/features/financial-resources TEMP_TSC_AFTER_REFACTOR.txt TEMP_LINT_AFTER_REFACTOR.txt
          git commit -m 'fix(financial-resources): move helper components to module scope' || true
          git push
