name: Temporary Lint Diagnostic

on:
  push:
    branches: [audit/lint-report-20260906]

permissions:
  contents: write

jobs:
  report:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund --prefer-offline
      - name: Validate financial resources lint surface
        run: |
          npx tsc --noEmit > /tmp/tsc.log 2>&1 || true
          npx eslint src/features/financial-resources/financial-resources-operations-center.tsx src/features/financial-resources/financial-resources-workspace.tsx src/features/financial-resources/financial-resources-settings.tsx src/features/financial-resources/payment-center.tsx src/features/financial-resources/financial-plans-operations.tsx src/features/financial-resources/financial-plans-insurance-center.tsx --format json > /tmp/lint.json || true
          node <<'NODE'
          const fs=require('fs');
          const data=JSON.parse(fs.readFileSync('/tmp/lint.json','utf8'));
          let out='# Financial resources lint after helper refactor\n\n';
          let errors=0,warnings=0;
          const rows=[];
          for(const f of data) for(const m of f.messages){if(m.severity===2)errors++;else warnings++;rows.push(`${f.filePath.replace(process.cwd()+'/','')}:${m.line}:${m.column} [${m.severity===2?'error':'warning'}] ${m.ruleId||'parse-error'} ${String(m.message).replace(/\s+/g,' ').slice(0,180)}`)}
          out+=`Errors: ${errors}\nWarnings: ${warnings}\nFindings: ${rows.length}\n\n${rows.join('\n')}\n`;
          fs.writeFileSync('TEMP_LINT_AFTER_REFACTOR.txt',out);
          fs.writeFileSync('TEMP_TSC_AFTER_REFACTOR.txt',fs.readFileSync('/tmp/tsc.log','utf8'));
          NODE
      - name: Commit diagnostics
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add TEMP_LINT_AFTER_REFACTOR.txt TEMP_TSC_AFTER_REFACTOR.txt
          git commit -m 'chore(audit): record post-refactor lint diagnostics' || true
          git push
