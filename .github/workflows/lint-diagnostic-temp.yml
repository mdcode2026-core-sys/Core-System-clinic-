name: Temporary Lint Diagnostic

on:
  push:
    branches: [audit/lint-report-20260906]

permissions:
  contents: write

jobs:
  report:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund --prefer-offline
      - name: Apply remaining lint repairs
        run: |
          node <<'NODE'
          const fs=require('fs');
          function patch(file, replacements){let s=fs.readFileSync(file,'utf8');for(const [from,to] of replacements){if(!s.includes(from))throw new Error(`Pattern not found in ${file}: ${from.slice(0,120)}`);s=s.replace(from,to)}fs.writeFileSync(file,s)}
          patch('src/app/(dashboard)/workforce/payroll/page.tsx',[["/* eslint-disable @typescript-eslint/no-explicit-any */\n",""]]);
          patch('src/core/entitlements/useEntitlements.ts',[["import { useMemo } from \"react\";","import { useCallback, useMemo } from \"react\";"],["const hasCapability = (key: string) => clinicAdmin || capabilities.includes(key);","const hasCapability = useCallback((key: string) => clinicAdmin || capabilities.includes(key), [clinicAdmin, capabilities]);"],["[capabilities, clinicAdmin, isLoading, error]","[capabilities, hasCapability, isLoading, error]"]]);
          patch('src/features/medical-files/ui/MedicalFilesPanel.tsx',[["import { useEffect, useMemo, useRef, useState, useTransition } from \"react\";","import { useCallback, useEffect, useMemo, useRef, useState, useTransition } from \"react\";"],["import { ExternalLink, FileText, Image as ImageIcon, RefreshCw, RotateCcw, RotateCw, Upload, X, ZoomIn, ZoomOut, UserRound } from \"lucide-react\";","import { ExternalLink, FileText, Image as ImageIcon, RefreshCw, RotateCcw, RotateCw, Upload, X, ZoomIn, ZoomOut, UserRound } from \"lucide-react\";\nimport Image from \"next/image\";"],["const load = () => startTransition(async () => {","const load = useCallback(() => startTransition(async () => {"] ,[" });\n  useEffect(() => { load(); }, [patientId, visitId]);"," });\n  }, [patientId, visitId, t.loadFailed]);\n  useEffect(() => { load(); }, [load]);"],["<div className=\"flex max-h-[65vh] min-h-[220px] w-full items-center justify-center overflow-auto rounded bg-black p-1 sm:min-h-[320px] sm:p-2\"><img src={previewUrl} alt={selected.original_filename} draggable={false} className=\"block h-auto max-h-[60vh] w-auto max-w-full object-contain transition-transform duration-150\" style={{ transform: `scale(${imageScale}) rotate(${imageRotation}deg)`, transformOrigin: \"center center\" }} /></div>","<div className=\"relative flex h-[65vh] min-h-[220px] w-full items-center justify-center overflow-auto rounded bg-black p-1 sm:min-h-[320px] sm:p-2\"><Image src={previewUrl} alt={selected.original_filename} fill unoptimized sizes=\"100vw\" draggable={false} className=\"object-contain transition-transform duration-150\" style={{ transform: `scale(${imageScale}) rotate(${imageRotation}deg)`, transformOrigin: \"center center\" }} /></div>"]]);
          NODE
      - name: Validate full repository lint and TypeScript
        run: |
          npx tsc --noEmit > /tmp/tsc.log 2>&1 || true
          npx eslint . --format json > /tmp/lint.json || true
          node <<'NODE'
          const fs=require('fs');const data=JSON.parse(fs.readFileSync('/tmp/lint.json','utf8'));let e=0,w=0,rows=[];for(const f of data)for(const m of f.messages){m.severity===2?e++:w++;rows.push(`${f.filePath.replace(process.cwd()+'/','')}:${m.line}:${m.column} [${m.severity===2?'error':'warning'}] ${m.ruleId||'parse-error'} ${String(m.message).replace(/\s+/g,' ').slice(0,180)}`)}fs.writeFileSync('TEMP_LINT_FINAL_DIAGNOSTIC.txt',`Errors: ${e}\nWarnings: ${w}\nFindings: ${rows.length}\n\n${rows.join('\n')}\n`);fs.writeFileSync('TEMP_TSC_FINAL_DIAGNOSTIC.txt',fs.readFileSync('/tmp/tsc.log','utf8'));
          if(e||w)process.exitCode=1;
          NODE
      - name: Commit repairs and diagnostics
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add eslint.config.mjs src/app/'(dashboard)'/workforce/payroll/page.tsx src/core/entitlements/useEntitlements.ts src/features/medical-files/ui/MedicalFilesPanel.tsx TEMP_LINT_FINAL_DIAGNOSTIC.txt TEMP_TSC_FINAL_DIAGNOSTIC.txt
          git commit -m 'fix(lint): close remaining repository diagnostics' || true
          git push
