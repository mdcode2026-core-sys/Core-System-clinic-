name: Test Execution Contract

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      base_ref:
        description: Base ref for execution comparison
        required: false
        default: main

env:
  NODE_VERSION: '22'

jobs:
  execute:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Fetch execution baseline and candidate refs
        env:
          TEST_BASE_REF: ${{ github.event.pull_request.base.sha || inputs.base_ref || 'main' }}
          TEST_HEAD_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$TEST_BASE_REF"
          git fetch --no-tags --depth=1 origin "$TEST_HEAD_REF"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Restore Playwright browser cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-1.55.0-ubuntu-24.04

      - name: Install dependencies
        run: npm ci

      - name: SETUP — build execution contract
        env:
          TEST_BASE_REF: ${{ github.event.pull_request.base.sha || inputs.base_ref || 'main' }}
          TEST_HEAD_REF: ${{ github.event.pull_request.head.sha || github.sha }}
          TEST_EXECUTION_PLAN: test-execution-plan.json
        run: node tools/test-execution-setup.mjs

      - name: Validate execution plan
        run: node -e "const p=require('./test-execution-plan.json'); if(!p || !Array.isArray(p.suites)) process.exit(1); console.log('Validated execution plan:', p.suites.length, 'suites')"

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Execute Unified Test Execution Engine
        env:
          TEST_EXECUTION_PLAN: test-execution-plan.json
        run: node tools/test-execution-runner.mjs

      - name: Publish execution report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-execution-report
          path: |
            test-execution-plan.json
            test-execution-report.json
          if-no-files-found: warn

      - name: Final execution decision
        if: always()
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync('test-execution-report.json', 'utf8'));
          const s = p.summary || {};
          console.log(JSON.stringify({
            status: p.status,
            total: s.total,
            passed: s.passed,
            failed: s.failed,
            skipped: s.skipped,
            executed_unique_commands: s.executed_unique_commands ?? s.total
          }, null, 2));
          if (p.status !== 'passed') process.exit(1);
          NODE
