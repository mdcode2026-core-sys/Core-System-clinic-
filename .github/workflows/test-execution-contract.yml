name: CORE SYSTEM Workstream Verification

# Canonical verification architecture:
# - one detection job
# - independent verification lane jobs
# - one final aggregation job
# No test runner executes multiple unrelated workstreams in one process.

on:
  pull_request:
  workflow_dispatch:
    inputs:
      base_ref:
        description: Baseline ref for manual verification
        required: false
        type: string
        default: main

permissions:
  contents: read

concurrency:
  group: core-system-verification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NEXT_PUBLIC_SUPABASE_URL: https://qaslsjyxjwvdoiczmhgq.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
  CORE_SYSTEM_E2E_EMAIL: ${{ secrets.CORE_SYSTEM_E2E_EMAIL }}
  CORE_SYSTEM_E2E_PASSWORD: ${{ secrets.CORE_SYSTEM_E2E_PASSWORD }}
  CORE_SYSTEM_PRODUCTION_URL: http://127.0.0.1:3000
  NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000

jobs:
  plan:
    name: VERIFY — Build applicable lane plan
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_lanes: ${{ steps.plan.outputs.has_lanes }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build lane plan
        id: plan
        env:
          TEST_BASE_REF: ${{ github.event.pull_request.base.sha || inputs.base_ref || 'main' }}
          TEST_HEAD_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node tools/workstream-verification-plan.mjs

  verify:
    name: VERIFY — ${{ matrix.id }}
    needs: plan
    if: needs.plan.result == 'success'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Restore npm cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-
      - name: Execute isolated verification lane
        env:
          VERIFICATION_LANE: ${{ matrix.id }}
          TEST_BASE_REF: ${{ github.event.pull_request.base.sha || inputs.base_ref || 'main' }}
          TEST_HEAD_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node tools/workstream-verification-lane.mjs
      - name: Publish lane evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-system-verification-${{ matrix.id }}-${{ github.sha }}
          path: verification-lane-${{ matrix.id }}.json
          if-no-files-found: warn

  gate:
    name: VERIFY — Final gate
    needs: [plan, verify]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate verification result
        run: |
          echo "PLAN_RESULT=${{ needs.plan.result }}"
          echo "LANES_RESULT=${{ needs.verify.result }}"
          if [ "${{ needs.plan.result }}" != "success" ]; then
            echo "VERIFICATION_GATE=FAIL reason=lane-plan-failed"
            exit 1
          fi
          if [ "${{ needs.verify.result }}" != "success" ]; then
            echo "VERIFICATION_GATE=FAIL reason=one-or-more-verification-lanes-failed"
            exit 1
          fi
          echo "VERIFICATION_GATE=PASS"
