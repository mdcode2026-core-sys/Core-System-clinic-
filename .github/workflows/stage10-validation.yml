name: Stage 10 Validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage10:
    name: Stage 10 Sidebar Finalization Gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify lockfile
        run: |
          npm install --package-lock-only --ignore-scripts
          git diff --exit-code -- package-lock.json
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: TypeScript
        run: npx tsc --noEmit
      - name: I18N audit
        run: npm run i18n:audit
      - name: I18N parity
        run: npm run i18n:parity
      - name: Stage 5 Widget Catalog audit
        run: npm run ux:widget-catalog
      - name: Stage 5 Domain Surface audit
        run: npm run ux:domain-surface
      - name: Stage 6 Patient Flow audit
        run: npm run ux:patient-flow-stage6
      - name: Stage 7 Patient Context audit
        run: npm run ux:patient-context-stage7
      - name: Stage 8 Global Search audit
        run: npm run ux:global-search-stage8
      - name: Stage 9 Overview / Dashboard audit
        run: node tools/overview-dashboard-stage9-audit.mjs
      - name: Stage 10 Sidebar audit
        run: node tools/sidebar-stage10-audit.mjs
      - name: Changed-surface ESLint
        run: npx eslint src/core/navigation/navigationRegistry.ts src/features/workspace/EntitlementAwareWorkspaceShell.tsx tools/sidebar-stage10-audit.mjs
      - name: Production build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://qaslsjyxjwvdoiczmhgq.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_APP_URL: http://localhost:3000
        run: npm run build
