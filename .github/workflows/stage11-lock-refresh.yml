name: Stage 11 Dependency Lock Refresh

on:
  push:
    branches: [stage11-mobile-responsive]

permissions:
  contents: write

jobs:
  refresh-lock:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(stage11): refresh dependency lockfile') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Regenerate package lock
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify package manifest was not changed
        run: git diff --exit-code -- package.json
      - name: Commit lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(stage11): refresh dependency lockfile"
          git push origin HEAD:stage11-mobile-responsive
