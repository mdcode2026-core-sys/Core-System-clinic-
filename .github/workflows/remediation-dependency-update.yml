name: Remediation Dependency Update

on:
  push:
    branches: [remediation-0903]

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: remediation-0903
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Scoped lockfile update
        run: npm update browserslist caniuse-lite --package-lock-only
      - name: Verify scope
        run: |
          git diff --name-only
          test "$(git diff --name-only)" = "package-lock.json"
          npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git rm .github/workflows/remediation-dependency-update.yml
          git diff --cached --name-only
          git diff --cached -- package-lock.json | grep -E 'browserslist|caniuse-lite' >/dev/null
          git commit -m "fix(security): update browserslist dependency chain"
          git push origin remediation-0903
