name: Stage 13 Lock Sync
on:
  push:
    branches: [stage13-runtime-e2e-validation]
permissions:
  contents: write
jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, 'synchronize package lock') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage13-runtime-e2e-validation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --package-lock-only --ignore-scripts
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "ci(stage13): synchronize package lock"
          git push origin HEAD:stage13-runtime-e2e-validation
