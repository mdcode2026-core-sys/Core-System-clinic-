name: UX Stages 0-5 CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ux-stages-0-5-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-validation:
    name: UX 0-5 Pre-deployment Validation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Synchronize lockfile from package manifest
        run: npm install --package-lock-only --ignore-scripts

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: TypeScript
        run: npx tsc --noEmit

      - name: I18N audit
        run: npm run i18n:audit

      - name: I18N parity
        run: npm run i18n:parity

      - name: Stage 5 Widget Catalog audit
        run: npm run ux:widget-catalog

      - name: Stage 0-5 changed-surface ESLint
        run: |
          npx eslint \
            'src/core/workspace/hooks/useWorkspace.ts' \
            'src/core/workspace/widgetCatalog.ts' \
            'src/core/workspace/widgetRegistry.ts' \
            'src/features/workspace/WorkspaceRenderer.tsx' \
            'src/features/workspace/WidgetContainer.tsx' \
            'src/features/workspace/WidgetToolbar.tsx' \
            'src/core/i18n/workspaceMessages.ts' \
            'src/core/i18n/invoiceMessages.ts' \
            'src/core/i18n/portalMessages.ts' \
            'src/app/(auth)/register/page.tsx' \
            'src/features/financial-resources/financial-resource-table.tsx' \
            'src/features/invoicing/invoice-detail.tsx' \
            'src/features/patient-portal/patient-messaging.tsx' \
            'src/features/workspace/WorkspaceShell.tsx' \
            'src/features/settings/ClinicProfileForm.tsx' \
            'src/shared/components/ui/dialog.tsx' \
            'src/shared/components/ui/sheet.tsx' \
            'tools/i18n-audit.mjs' \
            'tools/widget-catalog-audit.mjs'

      - name: Production build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://qaslsjyxjwvdoiczmhgq.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_APP_URL: http://localhost:3000
        run: npm run build

      - name: Commit synchronized lockfile when required
        if: success()
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: synchronize package lockfile"
          git push
