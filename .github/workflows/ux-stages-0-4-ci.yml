name: UX Stages 0-5 CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ux-stages-0-5-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-validation:
    name: UX 0-5 Pre-deployment Validation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify lockfile is synchronized
        run: |
          npm install --package-lock-only --ignore-scripts
          git diff --exit-code -- package-lock.json
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: TypeScript
        run: npx tsc --noEmit
      - name: I18N audit
        run: npm run i18n:audit
      - name: I18N parity
        run: npm run i18n:parity
      - name: Stage 5 Widget Catalog audit
        run: npm run ux:widget-catalog
      - name: Stage 5 Domain Surface audit
        run: npm run ux:domain-surface
      - name: Full repository ESLint diagnostic
        run: npx eslint .
      - name: Production build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://qaslsjyxjwvdoiczmhgq.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_APP_URL: http://localhost:3000
        run: npm run build
