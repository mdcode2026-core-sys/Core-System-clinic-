name: UX Stages 0-7 CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ux-stages-0-7-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-validation:
    name: UX 0-7 Pre-deployment Validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify lockfile is synchronized
        run: |
          npm install --package-lock-only --ignore-scripts
          git diff --exit-code -- package-lock.json
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Production dependency vulnerability diagnostic
        id: npm-audit
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high
      - name: TypeScript
        run: npx tsc --noEmit
      - name: I18N audit
        run: npm run i18n:audit
      - name: I18N parity
        run: npm run i18n:parity
      - name: Stage 5 Widget Catalog audit
        run: npm run ux:widget-catalog
      - name: Stage 5 Domain Surface audit
        run: npm run ux:domain-surface
      - name: Stage 6 Patient Flow audit
        run: npm run ux:patient-flow-stage6
      - name: Stage 7 Patient Context audit
        run: npm run ux:patient-context-stage7
      - name: Full repository ESLint diagnostic
        id: full-eslint
        continue-on-error: true
        run: npx eslint .
      - name: Stage 7 changed-surface ESLint gate
        run: >-
          npx eslint
          "src/app/(dashboard)/agenda/page.tsx"
          "src/app/(dashboard)/invoices/page.tsx"
          "src/features/patient-context/PatientContextPanel.tsx"
          src/features/patients/patient-detail.tsx
          src/core/i18n/messages.ts
          src/core/navigation/navigationRegistry.ts
          src/core/permissions/types.ts
      - name: Production build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://qaslsjyxjwvdoiczmhgq.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_APP_URL: http://localhost:3000
        run: npm run build
      - name: Publish validation finding summary
        if: always()
        run: |
          if [ "${{ steps.npm-audit.outcome }}" = "failure" ]; then
            echo "Production dependency audit reports high-severity vulnerabilities; see npm audit output." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Production dependency audit passed at high severity." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "${{ steps.full-eslint.outcome }}" = "failure" ]; then
            echo "Full-repository ESLint reports pre-existing/non-Stage-7 findings." >> "$GITHUB_STEP_SUMMARY"
            echo "The blocking Stage 7 changed-surface ESLint gate above must pass." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Full-repository ESLint passed." >> "$GITHUB_STEP_SUMMARY"
          fi
