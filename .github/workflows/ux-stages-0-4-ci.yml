name: UX Stages 0-8 CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ux-stages-0-8-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-validation:
    name: UX 0-8 Pre-deployment Validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify lockfile is synchronized
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          git diff --exit-code -- package-lock.json
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund --prefer-offline
      - name: Production dependency vulnerability diagnostic
        id: npm-audit
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high
      - name: TypeScript
        run: npx tsc --noEmit
      - name: I18N audit
        run: npm run i18n:audit
      - name: I18N parity
        run: npm run i18n:parity
      - name: Stage 5 Widget Catalog audit
        run: npm run ux:widget-catalog
      - name: Stage 5 Domain Surface audit
        run: npm run ux:domain-surface
      - name: Stage 6 Patient Flow audit
        run: npm run ux:patient-flow-stage6
      - name: Stage 7 Patient Context audit
        run: npm run ux:patient-context-stage7
      - name: Stage 8 Global Search audit
        run: npm run ux:global-search-stage8
      - name: Stage 8 changed-surface ESLint gate
        run: >-
          npx eslint
          src/core/search/actions.ts
          src/core/search/GlobalSearch.tsx
          src/core/i18n/globalSearchMessages.ts
          src/features/workspace/WorkspaceShell.tsx
          tools/global-search-stage8-audit.mjs
      - name: Production build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://qaslsjyxjwvdoiczmhgq.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_APP_URL: http://localhost:3000
        run: npm run build
      - name: Publish validation finding summary
        if: always()
        run: |
          if [ "${{ steps.npm-audit.outcome }}" = "failure" ]; then
            echo "Production dependency audit reports high-severity vulnerabilities; see npm audit output." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Production dependency audit passed at high severity." >> "$GITHUB_STEP_SUMMARY"
          fi

  repository-eslint-diagnostic:
    name: Repository-wide ESLint Diagnostic
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund --prefer-offline
      - name: Full repository ESLint diagnostic
        run: npx eslint .
