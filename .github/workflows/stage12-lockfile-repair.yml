name: Stage 12 Lockfile Reconciliation

on:
  push:
    branches: [stage12-security-permission-regression]

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Reconcile package-lock.json
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit only a real lockfile reconciliation
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(stage12): synchronize npm lockfile"
          git push
