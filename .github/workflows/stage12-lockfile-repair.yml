name: Stage 12 Lockfile Reconciliation

on:
  push:
    branches: [remediation-0903]

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Scoped browserslist lockfile update
        run: npm update browserslist caniuse-lite --package-lock-only
      - name: Verify only allowed dependency chain changed
        run: |
          git diff --name-only
          test "$(git diff --name-only)" = "package-lock.json"
          npm ci --ignore-scripts
          npm audit --omit=dev --audit-level=high
      - name: Commit lockfile and restore workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -- .github/workflows/stage12-lockfile-repair.yml
          git add package-lock.json .github/workflows/stage12-lockfile-repair.yml
          git diff --cached --name-only
          git commit -m "fix(security): update browserslist dependency chain"
          git push origin remediation-0903
