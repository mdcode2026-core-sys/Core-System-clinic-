name: CORE SYSTEM Reality Audit - Local CI

on:
  push:
    branches: [main, fix/workforce-closure, fix/cross-domain-runtime-closure-20260910]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  NEXT_PUBLIC_SUPABASE_URL: https://qaslsjyxjwvdoiczmhgq.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_6InZMjv8x7bi3WOC2Vy_nQ_d9F2Gy-Q

jobs:
  reality-audit:
    name: Local/Codespaces Reality Validation
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: SETUP execution contract
        env:
          TEST_BASE_REF: origin/main
          TEST_HEAD_REF: HEAD
        run: npm run test:execution-setup
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: I18N
        run: |
          npm run i18n:audit
          npm run i18n:parity
      - name: UX/IA audits
        run: |
          npm run ux:widget-catalog
          npm run ux:domain-surface
          npm run ux:patient-flow-stage6
          npm run ux:patient-context-stage7
          npm run ux:global-search-stage8
          npm run ux:mobile-stage11
          npm run ux:security-stage12
          npm run ux:legacy-stage14
          npm run ux:docs-stage15
      - name: AJM audits
        run: |
          npm run ajm:audit
          npm run ajm:migrations
      - name: Cross-domain runtime reconciliation
        env:
          CORE_SYSTEM_E2E_EMAIL: ${{ secrets.CORE_SYSTEM_E2E_EMAIL }}
          CORE_SYSTEM_E2E_PASSWORD: ${{ secrets.CORE_SYSTEM_E2E_PASSWORD }}
        run: npm run test:cross-domain-runtime
      - name: Production build without Vercel
        env:
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
        run: npm run build
      - name: Install Playwright
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.55.0 playwright@1.55.0
          npx playwright install chromium
      - name: Start local production server
        env:
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
          PORT: 3000
        run: |
          nohup npm start > /tmp/core-system-next.log 2>&1 &
          echo $! > /tmp/core-system-next.pid
          for i in $(seq 1 60); do
            if curl -fsS --max-time 3 http://127.0.0.1:3000/api/build-info; then
              echo
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:3000/api/build-info
      - name: Local authenticated route E2E
        env:
          CORE_SYSTEM_PRODUCTION_URL: http://127.0.0.1:3000
          CORE_SYSTEM_E2E_EMAIL: ${{ secrets.CORE_SYSTEM_E2E_EMAIL }}
          CORE_SYSTEM_E2E_PASSWORD: ${{ secrets.CORE_SYSTEM_E2E_PASSWORD }}
        run: npx playwright test tools/ajm-production-auth-e2e.spec.mjs --reporter=line
      - name: Local real-world clinic journey E2E
        timeout-minutes: 20
        env:
          CORE_SYSTEM_PRODUCTION_URL: http://127.0.0.1:3000
          CORE_SYSTEM_E2E_EMAIL: ${{ secrets.CORE_SYSTEM_E2E_EMAIL }}
          CORE_SYSTEM_E2E_PASSWORD: ${{ secrets.CORE_SYSTEM_E2E_PASSWORD }}
        run: timeout 18m node tools/clinic-admin-real-world-e2e-v2.mjs
      - name: Stop local server
        if: always()
        run: |
          if [ -f /tmp/core-system-next.pid ]; then kill "$(cat /tmp/core-system-next.pid)" || true; fi
          cat /tmp/core-system-next.log || true
