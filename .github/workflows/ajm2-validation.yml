name: AJM-2 Validation

on:
  push:
    branches:
      - main
      - 'ajm/ajm-2-e2e-reconciliation'
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
