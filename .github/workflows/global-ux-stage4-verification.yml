name: Global UX IA Stage 4 Verification

on:
  pull_request:
    branches: [main]
    paths:
      - "src/core/workspace/**"
      - "src/core/i18n/**"
      - "src/features/workspace/**"
      - "docs/GLOBAL-UX-IA-STAGE-4-WORKSPACE-PERSONALIZATION-2026-08-28.md"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/global-ux-stage4-verification.yml"
  push:
    branches:
      - "feat/global-ux-stage-4-workspace-personalization"
  workflow_dispatch:

concurrency:
  group: stage4-verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-stage4:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Stage 4 ESLint
        run: npx eslint src/core/workspace/hooks/useWorkspace.ts src/core/i18n/workspaceMessages.ts src/features/workspace/WidgetContainer.tsx src/features/workspace/WidgetLibrary.tsx src/features/workspace/WidgetToolbar.tsx src/features/workspace/WorkspaceRenderer.tsx

      - name: I18N parity
        run: npm run i18n:parity

      - name: Production build
        run: npm run build
