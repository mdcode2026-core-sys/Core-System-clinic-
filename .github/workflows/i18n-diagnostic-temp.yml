name: Temporary I18N Diagnostic

on:
  push:
    branches: [audit/i18n-fix-20260906]

permissions:
  contents: write

jobs:
  report:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund --prefer-offline
      - name: Close remaining payroll literals
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/app/(dashboard)/workforce/payroll/page.tsx')
          s=p.read_text()
          s=s.replace(')} net</span>', ')} {ar ? "الصافي" : "net"}</span>')
          s=s.replace('>net</span>', '>{ar ? "الصافي" : "net"}</span>')
          s=s.replace('>Short-term period</', '>{ar ? "فترة قصيرة الأجل" : "Short-term period"}</')
          p.write_text(s)
          PY
      - name: Validate I18N
        run: |
          npm run i18n:parity
          npm run i18n:audit
      - name: Full validation
        run: |
          npx tsc --noEmit
          npx eslint .
      - name: Publish and clean temporary workflow
        if: success()
        run: |
          git add src/app/'(dashboard)'/workforce/payroll/page.tsx i18n-audit-report.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(workforce): close payroll i18n audit' || true
          git push
