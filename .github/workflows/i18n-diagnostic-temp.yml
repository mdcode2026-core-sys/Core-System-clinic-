name: Temporary I18N Diagnostic

on:
  push:
    branches: [audit/i18n-fix-20260906]

permissions:
  contents: write

jobs:
  report:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund --prefer-offline
      - name: Localize payroll literals
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/app/(dashboard)/workforce/payroll/page.tsx')
          s=p.read_text()
          attrs={
            'placeholder="Amount"':'placeholder={ar?"المبلغ":"Amount"}',
            'placeholder="Reason / reference"':'placeholder={ar?"السبب / المرجع":"Reason / reference"}',
            'placeholder="Short-term period"':'placeholder={ar?"فترة قصيرة الأجل":"Short-term period"}',
            'placeholder="Installment"':'placeholder={ar?"قسط":"Installment"}',
            'placeholder="Reason"':'placeholder={ar?"السبب":"Reason"}',
          }
          for a,b in attrs.items(): s=s.replace(a,b)
          pairs={
            '>net<':'>\{ar?"الصافي":"net"\}<',
            '>Manual<':'>\{ar?"يدوي":"Manual"\}<',
            '>Attendance<':'>\{ar?"الحضور":"Attendance"\}<',
            '>Leave<':'>\{ar?"الإجازة":"Leave"\}<',
            '>Bonus<':'>\{ar?"مكافأة":"Bonus"\}<',
            '>Benefit<':'>\{ar?"منفعة":"Benefit"\}<',
            '>Employee advance<':'>\{ar?"سلفة موظف":"Employee advance"\}<',
            '>Administrative action<':'>\{ar?"إجراء إداري":"Administrative action"\}<',
            '>Country rule<':'>\{ar?"قاعدة الدولة":"Country rule"\}<',
            '>Short-term<':'>\{ar?"قصيرة الأجل":"Short-term"\}<',
            '>Installment<':'>\{ar?"قسط":"Installment"\}<',
            '>No active benefits.<':'>\{ar?"لا توجد مزايا نشطة.":"No active benefits."\}<',
            '>Save<':'>\{ar?"حفظ":"Save"\}<',
          }
          for a,b in pairs.items(): s=s.replace(a,b)
          p.write_text(s)
          PY
      - name: Validate I18N
        run: |
          npm run i18n:parity
          npm run i18n:audit
      - name: Publish validation report
        if: always()
        run: |
          git add src/app/'(dashboard)'/workforce/payroll/page.tsx i18n-audit-report.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(workforce): localize payroll UI literals' || true
          git push
