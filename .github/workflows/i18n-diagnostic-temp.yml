name: Temporary I18N Diagnostic

on:
  push:
    branches: [audit/i18n-fix-20260906]

permissions:
  contents: write

jobs:
  report:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund --prefer-offline
      - name: Localize payroll literals
        run: |
          node <<'NODE'
          const fs=require('fs');
          const file='src/app/(dashboard)/workforce/payroll/page.tsx';
          let s=fs.readFileSync(file,'utf8');
          const attrs={"Amount":"المبلغ","Reason / reference":"السبب / المرجع","Short-term period":"فترة قصيرة الأجل","Installment":"قسط","Reason":"السبب"};
          for(const [en,ar] of Object.entries(attrs)){const from=`placeholder="${en}"`;const to=`placeholder={ar?"${ar}":"${en}"}`;if(!s.includes(from))throw new Error(`Missing ${from}`);s=s.split(from).join(to)}
          const jsx={"net":"الصافي","Manual":"يدوي","Attendance":"الحضور","Leave":"الإجازة","Bonus":"مكافأة","Benefit":"منفعة","Employee advance":"سلفة موظف","Administrative action":"إجراء إداري","Country rule":"قاعدة الدولة","Short-term":"قصيرة الأجل","Installment":"قسط","No active benefits.":"لا توجد مزايا نشطة.","Save":"حفظ"};
          for(const [en,ar] of Object.entries(jsx)){const re=new RegExp(`>(?:${en.replace(/[.*+?^${}()|[\\]\\\\]/g,'\\$&')})<`,'g');s=s.replace(re,`>{ar?"${ar}":"${en}"}<`)}
          fs.writeFileSync(file,s);
          NODE
      - name: Validate I18N
        run: |
          npm run i18n:parity
          npm run i18n:audit
      - name: Publish validation report
        if: always()
        run: |
          git add src/app/'(dashboard)'/workforce/payroll/page.tsx i18n-audit-report.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(workforce): localize payroll UI literals' || true
          git push
