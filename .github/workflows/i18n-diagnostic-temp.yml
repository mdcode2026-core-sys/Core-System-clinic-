name: Temporary I18N Diagnostic

on:
  push:
    branches: [audit/i18n-fix-20260906]

permissions:
  contents: write

jobs:
  report:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund --prefer-offline
      - name: Generate I18N report
        run: npm run i18n:audit || true
      - name: Publish report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add i18n-audit-report.json
          git commit -m 'chore(audit): publish i18n diagnostic report' || true
          git push
